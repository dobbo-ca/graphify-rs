name: bench
on: { workflow_dispatch: {} }
permissions:
  contents: read
# A new run waits for the one before it; it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Not a gate. The Go and Rust workloads run in one container, so the ratio compares the same
  # machine. The target is Rust within 1.10x of Go (spec section 7).
  bench:
    runs-on: github-arc-runner-set
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.github-arc.svc.cluster.local:1234
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile
          target: bench
          load: true
          push: false
          tags: graphify-rs-bench:local
          cache-from: type=gha,scope=graphify-rs-bench
          cache-to: type=gha,mode=max,scope=graphify-rs-bench
      # docker run, not a RUN layer: a BuildKit cache hit would skip the timing.
      - shell: bash # explicit shell adds pipefail, so a bench.sh failure is not masked by tee
        run: |
          { echo '### gostd against Go, one run per workload (lower is better)'; echo
            docker run --rm graphify-rs-bench:local sh parity/bench.sh; } | tee -a "$GITHUB_STEP_SUMMARY"
