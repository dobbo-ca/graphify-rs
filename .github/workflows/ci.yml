name: ci
on:
  pull_request: {}
  push: { branches: [main] }
  workflow_dispatch: {}
  # The heavy main stages (arm64, parity, parity-arm64) run on this schedule against the newest
  # main, not on every push: with several streams merging, per-push main runs queued behind PR
  # runs on the shared ARC runners and were replaced while pending, so none finished.
  schedule: [{ cron: '23 */3 * * *' }]
permissions:
  contents: read
concurrency:
  # One group per ref for push and PR runs (a PR's newer run cancels its older one; main pushes
  # never cancel). Scheduled runs have their own group, so a push never replaces a pending
  # scheduled run. A bead closes on a green scheduled or dispatched main run at or after its commit.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The checks run inside ci/Dockerfile on the in-cluster BuildKit (pattern from dobbo-ca/deflate-rs).
  # A PR runs test and gen (the required check is `test`). A push to main runs only macos (GitHub
  # hosted): the PR run already tested the same merge result. The scheduled run (and dispatch)
  # runs every ARC job on the newest main. A bead is done when that run is green.
  test:
    if: github.event_name != 'push'
    runs-on: github-arc-runner-set
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.github-arc.svc.cluster.local:1234
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile
          target: ci
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=graphify-rs-test
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=graphify-rs-test' || '' }}

  # The gostd Unicode tables, generated from the pinned UCD files (ci/Dockerfile `gen`), as an
  # artifact. To change them: download it (`gh run download -n ucd-tables`), copy unicode17.rs
  # into crates/gostd/src/tables/ and ucd.lock into crates/gostd-gen/, and commit. The `test`
  # job fails while the committed files differ from it.
  gen:
    if: github.event_name != 'push'
    runs-on: github-arc-runner-set
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.github-arc.svc.cluster.local:1234
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile
          target: gen
          push: false
          outputs: type=local,dest=gen-out
          cache-from: type=gha,scope=graphify-rs-gen
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=graphify-rs-gen' || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: ucd-tables, path: gen-out, if-no-files-found: error }

  arm64:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: github-arc-runner-set
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.github-arc.svc.cluster.local:1234
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile
          target: arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=graphify-rs-arm64
          cache-to: type=gha,mode=max,scope=graphify-rs-arm64

  # gostd against the Go oracle (parity/README.md): diff -r of the Go and Rust output trees.
  parity:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: github-arc-runner-set
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.github-arc.svc.cluster.local:1234
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile
          target: parity
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=graphify-rs-parity
          cache-to: type=gha,mode=min,scope=graphify-rs-parity

  # The same, with the oracle example built for aarch64 and run under qemu-aarch64.
  parity-arm64:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: github-arc-runner-set
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.github-arc.svc.cluster.local:1234
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile
          target: parity-arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=graphify-rs-parity-arm64
          cache-to: type=gha,mode=min,scope=graphify-rs-parity-arm64

  # The graphify tests on GitHub-hosted macOS (spec section 7, P2 on). Main and workflow_dispatch
  # only. gostd's tests need the Linux-only /gotest and /ucd inputs, so only graphify runs here.
  macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - run: rustup show
      - run: cargo test --locked -p graphify
