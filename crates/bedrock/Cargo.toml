[package]
name = "bedrock"
description = "Bedrock (mantle) Anthropic Messages client: HTTP/1.1, SigV4, credential chain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gostd = { path = "../gostd" }
# TLS with no C: see the README "Third-party crates" table.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4"
webpki-roots = "1"

[lints]
workspace = true
