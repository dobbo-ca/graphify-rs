[package]
name = "graphify"
description = "Code knowledge graph builder. Rust port of graphify-go v0.12.0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "graphify"
path = "src/main.rs"

[dependencies]
bedrock = { path = "../bedrock" }
gostd = { path = "../gostd" }
# gositter-rs (pure-Rust tree-sitter runtime and its 21 grammars), pinned by rev. Bump both together.
gositter = { git = "https://github.com/dobbo-ca/gositter-rs", rev = "2543d2c4ad18e378ede3dacf2aa46f85056c8c03" }
gositter-grammars = { git = "https://github.com/dobbo-ca/gositter-rs", rev = "2543d2c4ad18e378ede3dacf2aa46f85056c8c03" }

[lints]
workspace = true
